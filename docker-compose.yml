services:
  mysql:
    image: mysql:8.4
    container_name: kb-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kb
      MYSQL_USER: kb
      MYSQL_PASSWORD: kb_password
    ports:
      - "3307:3306" # 3307 so it doesnt clash with local mysql
    volumes:
      - kb-mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  kb-mysql-data:
