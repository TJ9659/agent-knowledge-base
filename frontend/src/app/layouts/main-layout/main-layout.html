<header class="header" (keydown.escape)="closeMenu(menuButton)">
  <div class="header__inner">
    <a class="brand" routerLink="/articles">
      <img src="logo.svg" alt="" width="32" height="32" />
      <span>Nexora <span class="brand__kb">KB</span></span>
    </a>

    <button
      #menuButton
      type="button"
      class="menu-button"
      aria-controls="main-menu"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      (click)="toggleMenu()"
    >
      @if (menuOpen()) {
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M6 6l12 12M18 6L6 18"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M4 7h16M4 12h16M4 17h16"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />
        </svg>
      }
    </button>

    <div id="main-menu" class="menu" [class.is-open]="menuOpen()">
      <nav class="nav" aria-label="Main">
        @for (link of links(); track link.path) {
          <a [routerLink]="link.path" routerLinkActive="is-active" ariaCurrentWhenActive="page">{{
            link.label
          }}</a>
        }
      </nav>

      @if (auth.user(); as user) {
        <div class="account">
          <span class="account__name">
            {{ user.name }} <span class="account__role">· {{ roleLabels[user.role] }}</span>
          </span>
          <button type="button" (click)="auth.logout()">Log out</button>
        </div>
      }
    </div>
  </div>
</header>

<main class="content">
  <router-outlet />
</main>

<app-confirm-dialog />
