<dialog #dialog class="confirm" aria-labelledby="confirm-title" (cancel)="confirm.answer(false)">
  @if (confirm.request(); as request) {
    <h2 id="confirm-title">{{ request.title }}</h2>
    <p>{{ request.message }}</p>
    <div class="confirm__actions">
      <button type="button" class="cancel" (click)="confirm.answer(false)">Cancel</button>
      <button type="button" class="danger" (click)="confirm.answer(true)">{{ request.confirmLabel }}</button>
    </div>
  }
</dialog>
